version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Type definitions follow the oldest Node.js we support (package.json engines),
      # so code never relies on APIs newer than that.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Base images of our own images. Third-party images (PostgreSQL, Valkey) use
  # major-version tags (postgres:18-alpine…), so pulls already bring patches.
  - package-ecosystem: docker
    directories: ["/docker/*", "/apps/*"]
    schedule:
      interval: weekly
