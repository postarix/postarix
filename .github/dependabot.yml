version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Type definitions follow the Node.js version we run (.nvmrc), not the newest.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Base images of our own images.
  - package-ecosystem: docker
    directories: ["/docker/*", "/apps/*"]
    schedule:
      interval: weekly
  # Third-party images run by Compose (PostgreSQL, Valkey…).
  - package-ecosystem: docker-compose
    directory: /docker/compose
    schedule:
      interval: weekly
