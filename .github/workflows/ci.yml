name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postarix
          POSTGRES_PASSWORD: postarix
          POSTGRES_DB: postarix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postarix -d postarix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postarix:postarix@127.0.0.1:5432/postarix_test

    steps:
      - uses: actions/checkout@v5

      # Installs the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check migrations are up to date
        run: |
          pnpm --filter @postarix/api db:generate
          git diff --exit-code -- apps/api/drizzle || {
            echo "::error::Schema changed without a migration. Run 'pnpm --filter @postarix/api db:generate' and commit the result."
            exit 1
          }

  integration:
    name: Integration (full mail stack)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build images, start the stack and run the integration tests
        run: tests/integration/run.sh
