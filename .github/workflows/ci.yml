name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postarix
          POSTGRES_PASSWORD: postarix
          POSTGRES_DB: postarix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postarix -d postarix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postarix:postarix@127.0.0.1:5432/postarix_test
      TEST_VALKEY_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v5

      # Installs the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check migrations are up to date
        run: |
          pnpm --filter @postarix/api db:generate
          git diff --exit-code -- apps/api/drizzle || {
            echo "::error::Schema changed without a migration. Run 'pnpm --filter @postarix/api db:generate' and commit the result."
            exit 1
          }

  e2e:
    name: Admin panel end-to-end (Playwright)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postarix
          POSTGRES_PASSWORD: postarix
          POSTGRES_DB: postarix_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postarix -d postarix_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      E2E_DATABASE_URL: postgresql://postarix:postarix@127.0.0.1:5432/postarix_e2e_test

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @postarix/admin exec playwright install --with-deps chromium

      - name: Build the API and the admin panel
        run: |
          pnpm --filter @postarix/api... build
          API_INTERNAL_URL=http://localhost:3100 pnpm --filter @postarix/admin build

      - name: Run the end-to-end tests
        run: pnpm --filter @postarix/admin test:e2e

      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/admin/test-results
          retention-days: 7

  integration:
    name: Integration (full mail stack)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium (webmail browser tests)
        run: pnpm --filter @postarix/integration-tests exec playwright install --with-deps chromium

      - name: Build images, start the stack and run the integration tests
        run: tests/integration/run.sh

      - name: Upload traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webmail-traces
          path: tests/integration/test-results
          retention-days: 7

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: The chart's init script matches the Compose one
        run: cmp deploy/helm/postarix/files/10-postarix-mail-role.sh docker/postgres/10-postarix-mail-role.sh
      - name: Lint and render
        run: |
          helm lint deploy/helm/postarix -f deploy/helm/postarix/ci-values.yaml
          helm template postarix deploy/helm/postarix -f deploy/helm/postarix/ci-values.yaml > /tmp/rendered.yaml
          helm template postarix deploy/helm/postarix -f deploy/helm/postarix/ci-values.yaml \
            --set postgresql.enabled=false,postgresql.host=db.example,valkey.enabled=false,valkey.host=cache.example,existingSecret=postarix,networkPolicies.enabled=false,ingress.enabled=false,tls.certManager.enabled=true >> /tmp/rendered.yaml
          helm template postarix deploy/helm/postarix -f deploy/helm/postarix/ci-values.yaml \
            --set 'ingress.discoveryDomains={example.com}' --set ingress.tlsSecretName=web-tls > /tmp/ingress.yaml
          # /api/internal must never be routed, and the discovery names must be.
          ! grep -E 'path: /api/?$|path: /api/internal' /tmp/ingress.yaml
          grep -q 'host: "autoconfig.example.com"' /tmp/ingress.yaml
          grep -q 'host: "mta-sts.example.com"' /tmp/ingress.yaml
          cat /tmp/ingress.yaml >> /tmp/rendered.yaml
      - name: Validate against the Kubernetes schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          ./kubeconform -strict -summary -ignore-missing-schemas /tmp/rendered.yaml

  kubernetes:
    name: Helm chart on Kubernetes (kind)
    needs: [check, helm]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: azure/setup-helm@v4

      - name: Build the images
        run: docker compose -f docker/compose/postarix.yml --env-file docker/compose/test.env build api admin webmail cyrus postfix rspamd unbound

      - uses: helm/kind-action@v1
        with:
          cluster_name: postarix

      - name: Load the images into the cluster
        run: |
          for image in api admin webmail cyrus postfix rspamd unbound; do
            kind load docker-image "postarix/$image:dev" --name postarix
          done

      - name: Install the chart
        run: |
          kubectl create namespace postarix
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=mail.postarix.test \
            -addext subjectAltName=DNS:mail.postarix.test -keyout /tmp/tls.key -out /tmp/tls.crt
          kubectl -n postarix create secret tls postarix-mail-tls --cert=/tmp/tls.crt --key=/tmp/tls.key
          # ci-values.yaml pins the cluster DNS address for helm template; here it is looked up.
          helm install postarix deploy/helm/postarix -n postarix \
            -f deploy/helm/postarix/ci-values.yaml -f deploy/helm/postarix/kind-values.yaml \
            --wait --timeout 15m

      - name: The mail pod resolves through its own validating resolver
        run: |
          kubectl -n postarix exec postarix-mail-0 -c postfix -- cat /etc/resolv.conf
          kubectl -n postarix exec postarix-mail-0 -c postfix -- getent hosts postarix-rspamd
          kubectl -n postarix exec postarix-mail-0 -c postfix -- getent hosts github.com
          test "$(kubectl -n postarix exec postarix-mail-0 -c postfix -- postconf -h smtp_tls_security_level)" = dane

      - name: Mail flow through the cluster
        env:
          ADMIN_EMAIL: admin@postarix.test
          ADMIN_PASSWORD: kubernetes admin password
        run: |
          kubectl -n postarix exec deploy/postarix-api -- env ADMIN_EMAIL="$ADMIN_EMAIL" ADMIN_PASSWORD="$ADMIN_PASSWORD" ADMIN_NAME=Admin node dist/cli/create-admin.js
          kubectl -n postarix port-forward svc/postarix-api 3000:3000 > /tmp/pf-api.log 2>&1 &
          kubectl -n postarix port-forward svc/postarix-mail 2525:25 5870:587 4650:465 9930:993 1430:143 41900:4190 > /tmp/pf-mail.log 2>&1 &
          for port in 3000 2525 9930 41900; do
            timeout 60 sh -c "until nc -z 127.0.0.1 $port; do sleep 1; done"
          done
          # Everything but the tests that need the test-only spam rule.
          pnpm --filter @postarix/integration-tests exec vitest run src/mail-flow.test.ts src/sieve.test.ts \
            -t "provisioning|submission and delivery|vacation|redirect|another organization"

      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n postarix describe pods
          for pod in $(kubectl -n postarix get pods -o name); do
            kubectl -n postarix logs "$pod" --all-containers --tail=150 || true
          done

