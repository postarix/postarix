name: Release

# A version tag (v1.2.3) publishes:
#   - every image to ghcr.io/postarix/<image>:1.2.3 (and 1.2, and latest for
#     stable versions), for amd64 and arm64, with an SBOM and build provenance,
#     signed with Sigstore (keyless, tied to this workflow);
#   - the Helm chart to oci://ghcr.io/postarix/charts/postarix;
#   - a GitHub release with notes and the Compose files.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Not a version tag: $GITHUB_REF_NAME"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  build:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    needs: version
    strategy:
      fail-fast: true
      matrix:
        image: [api, admin, webmail, cyrus, postfix, rspamd, unbound, certs, clamav, crowdsec]
        platform: [linux/amd64, linux/arm64]
    # Native runners for each architecture: no emulation.
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Build context
        id: ctx
        run: |
          case "${{ matrix.image }}" in
            api|admin|webmail) echo "context=." >> "$GITHUB_OUTPUT"; echo "file=apps/${{ matrix.image }}/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            *) echo "context=docker/${{ matrix.image }}" >> "$GITHUB_OUTPUT"; echo "file=docker/${{ matrix.image }}/Dockerfile" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "arch=$(echo '${{ matrix.platform }}' | cut -d/ -f2)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.ctx.outputs.context }}
          file: ${{ steps.ctx.outputs.file }}
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ steps.ctx.outputs.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ steps.ctx.outputs.arch }}

      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.image }}-${{ steps.ctx.outputs.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ steps.ctx.outputs.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    needs: [version, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, admin, webmail, cyrus, postfix, rspamd, unbound, certs, clamav, crowdsec]
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore keyless signing
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Tag both architectures under the version, sign
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
        run: |
          tags=(-t "$IMAGE:$VERSION")
          if [ "$PRERELEASE" = false ]; then
            tags+=(-t "$IMAGE:${VERSION%.*}" -t "$IMAGE:latest")
          fi
          sources=()
          for file in /tmp/digests/*; do sources+=("$IMAGE@$(cat "$file")"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "$IMAGE@$digest"

  chart:
    name: Publish the Helm chart
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Package and push
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          helm lint deploy/helm/postarix -f deploy/helm/postarix/ci-values.yaml
          helm package deploy/helm/postarix --version "$VERSION" --app-version "$VERSION" -d /tmp/chart
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push /tmp/chart/postarix-"$VERSION".tgz "oci://${REGISTRY}/charts"

  release:
    name: GitHub release
    needs: [version, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          mkdir -p /tmp/assets
          tar -czf "/tmp/assets/postarix-compose-$VERSION.tar.gz" docker/compose docker/postgres deploy/scripts deploy/proxies deploy/monitoring
          flags=(--generate-notes --title "Postarix $VERSION")
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          cat > /tmp/notes.md <<EOF
          Images: \`ghcr.io/${{ github.repository_owner }}/<image>:$VERSION\` (amd64 and arm64, signed with Sigstore).
          Helm: \`helm install postarix oci://ghcr.io/${{ github.repository_owner }}/charts/postarix --version $VERSION\`.
          Compose: set \`POSTARIX_VERSION=$VERSION\` in postarix.env. Upgrade steps: docs/INSTALL.md.
          EOF
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" --notes-file /tmp/notes.md "/tmp/assets/postarix-compose-$VERSION.tar.gz"
