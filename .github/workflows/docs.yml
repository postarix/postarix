# Builds the documentation site (docs/, VitePress) and publishes it on GitHub
# Pages. One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the documentation
    outputs:
      publish: ${{ steps.pages.outcome == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # "Last updated" dates come from the history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @postarix/docs
      - id: pages
        if: github.event_name != 'pull_request'
        # Without Pages turned on, still build (and say how to turn it on).
        continue-on-error: true
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request' && steps.pages.outcome != 'success'
        run: |
          echo "::warning title=GitHub Pages is not turned on::Settings → Pages → Build and deployment → Source: GitHub Actions, then run this workflow again (Actions → Docs → Run workflow). The site was built but not published."
      - name: Build
        env:
          # The project's Pages path (/postarix/), or / with a custom domain.
          DOCS_BASE: ${{ steps.pages.outcome == 'success' && format('{0}/', steps.pages.outputs.base_path) || '/postarix/' }}
        run: pnpm --filter @postarix/docs docs:build
      - if: github.event_name != 'pull_request' && steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Publish on GitHub Pages
    if: github.event_name != 'pull_request' && needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
