# Postarix behind nginx. Include this file inside the http {} block.
# Replace mail.example.com and the certificate paths.
upstream postarix_api   { server api:3000;   keepalive 16; }
upstream postarix_cyrus { server cyrus:8080; keepalive 16; }
upstream postarix_admin { server admin:3001; keepalive 16; }
upstream postarix_webmail { server webmail:3002; keepalive 16; }

server {
    listen 80;
    server_name mail.example.com;

    location /.well-known/acme-challenge/ {
        proxy_pass http://certs:80;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mail.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 60m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Internal endpoints never leave the Docker network.
    # Case-insensitive on purpose: the API routes /api/INTERNAL/... too.
    location ~* ^/+api/+internal(/|$) { return 404; }

    location /api/ {
        proxy_pass http://postarix_api;
    }

    # Mail app setup and the MTA-STS policy (see deploy/proxies/README.md).
    location ~* ^/(\.well-known/autoconfig/|mail/config-v1\.1\.xml$|autodiscover/autodiscover\.xml$|\.well-known/mta-sts\.txt$) {
        proxy_pass http://postarix_api;
    }

    location /admin {
        proxy_pass http://postarix_admin;
    }

    # Calendars and contacts share the webmail's origin: nothing Cyrus serves
    # there may run, be framed, or be sniffed into HTML.
    location ~ ^/(\.well-known/(caldav|carddav)|dav/) {
        proxy_pass http://postarix_cyrus;
        proxy_buffering off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Everything else is the webmail.
    location / {
        proxy_pass http://postarix_webmail;
    }
}
