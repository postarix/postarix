# Labels for an existing Traefik (v3), such as Dokploy's or Coolify's.
# Usage:
#   docker compose -f docker/compose/postarix.yml -f deploy/proxies/traefik/compose.traefik.yml up -d
# Set as in your Traefik (defaults in brackets):
#   TRAEFIK_NETWORK        the Docker network Traefik watches [traefik]; Dokploy: dokploy-network
#   TRAEFIK_ENTRYPOINT     the HTTPS entrypoint [websecure]
#   TRAEFIK_HTTP_ENTRYPOINT the HTTP entrypoint, redirected to HTTPS [web]
#   TRAEFIK_CERTRESOLVER   the ACME resolver [letsencrypt]
# and TRUSTED_PROXIES to the address range of that network.
#
# That network is usually shared with other applications. Services joining it
# must not set `hostname:` to the mail host name (none does): Docker's DNS
# would then answer that name with the container's internal address to every
# container on the network, and other applications calling
# https://<mail host>/ would reach that container instead of Traefik.
services:
  api:
    networks: [default, traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      # Internal endpoints never leave the Docker network (case-insensitive, like Express routing).
      traefik.http.routers.postarix-api.rule: Host(`${MAIL_HOSTNAME}`) && PathPrefix(`/api/`) && !PathRegexp(`(?i)^/+api/+internal(/|$)`)
      traefik.http.routers.postarix-api.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.postarix-api.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.services.postarix-api.loadbalancer.server.port: "3000"
      # Mail app setup and MTA-STS, on the mail host and on every hosted domain's
      # autoconfig.* / mta-sts.* names (they need certificates: add them to your resolver).
      traefik.http.routers.postarix-discovery.rule: PathPrefix(`/.well-known/autoconfig/`) || Path(`/mail/config-v1.1.xml`) || PathRegexp(`(?i)^/autodiscover/autodiscover\.xml$`) || Path(`/.well-known/mta-sts.txt`)
      traefik.http.routers.postarix-discovery.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.postarix-discovery.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.postarix-discovery.service: postarix-api

  admin:
    networks: [traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.postarix-admin.rule: Host(`${MAIL_HOSTNAME}`) && (Path(`/admin`) || PathPrefix(`/admin/`))
      traefik.http.routers.postarix-admin.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.postarix-admin.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.services.postarix-admin.loadbalancer.server.port: "3001"

  webmail:
    networks: [traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      # Lowest priority: everything not claimed by the other routers.
      traefik.http.routers.postarix-webmail.rule: Host(`${MAIL_HOSTNAME}`)
      traefik.http.routers.postarix-webmail.priority: "1"
      traefik.http.routers.postarix-webmail.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.postarix-webmail.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.services.postarix-webmail.loadbalancer.server.port: "3002"
      # Plain HTTP on the mail host goes to HTTPS.
      traefik.http.routers.postarix-http.rule: Host(`${MAIL_HOSTNAME}`)
      traefik.http.routers.postarix-http.priority: "1"
      traefik.http.routers.postarix-http.entrypoints: ${TRAEFIK_HTTP_ENTRYPOINT:-web}
      traefik.http.routers.postarix-http.middlewares: postarix-https
      traefik.http.middlewares.postarix-https.redirectscheme.scheme: https
      traefik.http.middlewares.postarix-https.redirectscheme.permanent: "true"

  # Calendars and contacts (Cyrus' HTTP port). Cyrus has no `hostname:` (its
  # public name comes from MAIL_HOSTNAME), so joining this network does not
  # take over the mail host name.
  cyrus:
    networks: [default, traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.postarix-dav.rule: Host(`${MAIL_HOSTNAME}`) && (Path(`/.well-known/caldav`) || Path(`/.well-known/carddav`) || PathPrefix(`/dav/`))
      traefik.http.routers.postarix-dav.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.postarix-dav.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.services.postarix-dav.loadbalancer.server.port: "8080"
      # Calendars and contacts share the webmail's origin: nothing Cyrus serves
      # there may run, be framed, or be sniffed into HTML.
      traefik.http.routers.postarix-dav.middlewares: postarix-dav-headers
      traefik.http.middlewares.postarix-dav-headers.headers.contentSecurityPolicy: "default-src 'none'; sandbox; frame-ancestors 'none'"
      traefik.http.middlewares.postarix-dav-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.postarix-dav-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.postarix-dav-headers.headers.stsIncludeSubdomains: "true"

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
