# Postarix behind HAProxy. Replace the certificate path (a PEM with key + chain).
global
    log stdout format raw local0

defaults
    log     global
    mode    http
    option  httplog
    option  forwardfor
    timeout connect 5s
    timeout client  60s
    timeout server  60s

frontend http
    bind :80
    acl acme path_beg /.well-known/acme-challenge/
    http-request redirect scheme https code 301 unless acme
    use_backend certs if acme

frontend https
    bind :443 ssl crt /usr/local/etc/haproxy/certs/mail.example.com.pem alpn h2,http/1.1
    # Internal endpoints never leave the Docker network. API paths never need
    # percent-encoding, doubled slashes or dot segments, so refuse those outright
    # rather than trying to normalize them.
    acl api_internal path_reg -i ^/+api/+internal(/|$)
    acl api_odd      path_reg ^/+api(/|$).*(%|//|/\.\.?(/|$))
    http-request deny deny_status 404 if api_internal || api_odd
    acl api   path_beg /api/
    acl cyrus path /.well-known/caldav /.well-known/carddav
    acl cyrus path_beg /dav/
    use_backend api   if api
    use_backend cyrus if cyrus
    default_backend placeholder

backend api
    server api api:3000 check

backend cyrus
    server cyrus cyrus:8080 check

backend certs
    server certs certs:80

backend placeholder
    http-request return status 200 content-type text/plain string "Postarix"
