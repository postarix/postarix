# Alert rules for Postarix. Load them into Prometheus (rule_files).
groups:
  - name: postarix
    rules:
      - alert: PostarixApiDown
        expr: up{job="postarix-api"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: The Postarix API is not answering
          description: Prometheus cannot scrape the API on {{ $labels.instance }}. Sign-ins to mail apps, the admin panel and the webmail fail while it is down.

      - alert: PostarixSpamFilterDown
        expr: up{job="postarix-rspamd"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: Rspamd is not answering
          description: Postfix defers incoming and outgoing mail while the spam filter is unreachable.

      - alert: PostarixApiErrors
        expr: |
          sum(rate(postarix_http_requests_total{status=~"5.."}[10m]))
            / clamp_min(sum(rate(postarix_http_requests_total[10m])), 1e-9) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: More than 5% of API requests fail
          description: Check the API's logs (docker compose logs api).

      - alert: PostarixApiSlow
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(postarix_http_request_duration_seconds_bucket{route!~"/api/jmap/.*"}[10m]))) > 2
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: API requests are slow
          description: 95% of requests take longer than 2 seconds. Check the database and the mail server's load.

      - alert: PostarixMailLoginFailures
        expr: sum(rate(postarix_mail_logins_total{result="failure"}[10m])) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Many failed mail-app logins
          description: More than one failed IMAP/SMTP/DAV login a second, usually password guessing. CrowdSec bans the addresses; check `cscli decisions list`.

      - alert: PostarixWebSignInFailures
        expr: sum(rate(postarix_web_sign_ins_total{result=~"failure|blocked"}[10m])) > 0.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Many failed sign-ins to the admin panel or webmail
          description: Accounts are locked for 15 minutes after 10 failures; check the audit log for the accounts concerned.

      - alert: PostarixApiMemory
        expr: postarix_api_process_resident_memory_bytes > 1.5e9
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: The API uses more than 1.5 GB of memory
