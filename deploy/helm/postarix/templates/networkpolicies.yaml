{{- if .Values.networkPolicies.enabled }}
# The mail pod's internal ports (admin IMAP 1143, JMAP 8008, webmail
# submission 10587) only accept the API. Public mail ports and DAV stay open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "postarix.name" (list . "mail") }}
  labels: {{- include "postarix.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "postarix.selector" (list . "mail") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 25 }
        - { port: 465 }
        - { port: 587 }
        - { port: 143 }
        - { port: 993 }
        - { port: 995 }
        - { port: 4190 }
        - { port: 8080 }
    - from:
        - podSelector:
            matchLabels: {{- include "postarix.selector" (list . "api") | nindent 14 }}
      ports:
        - { port: 1143 }
        - { port: 8008 }
        - { port: 10587 }
    {{- if .Values.mail.murder.enabled }}
    # Sieve redirects and vacation replies from the Murder's backends.
    - from:
        - podSelector:
            matchLabels: {{- include "postarix.selector" (list . "cyrus-backend") | nindent 14 }}
      ports:
        - { port: 10588 }
    {{- end }}
---
# The API: its web port from anywhere (the ingress), its internal HTTPS port
# (mail-login bridge) from the mail pod only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "postarix.name" (list . "api") }}
  labels: {{- include "postarix.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "postarix.selector" (list . "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 3000 }
        {{- if .Values.metrics.enabled }}
        # Prometheus, wherever it runs in the cluster (the ingress does not route this port).
        - { port: 9464 }
        {{- end }}
    - from:
        - podSelector:
            matchLabels: {{- include "postarix.selector" (list . "mail") | nindent 14 }}
        {{- if .Values.mail.murder.enabled }}
        - podSelector:
            matchLabels: {{- include "postarix.selector" (list . "cyrus-backend") | nindent 14 }}
        {{- end }}
      ports:
        - { port: 3443 }
---
{{- if .Values.mail.murder.enabled }}
# Murder backends: reached by the frontend (mail pod) for clients and
# delivery, by the API for administration and JMAP, and by each other.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "postarix.name" (list . "cyrus-backend") }}
  labels: {{- include "postarix.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "postarix.selector" (list . "cyrus-backend") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "postarix.selector" (list . "mail") | nindent 14 }}
        - podSelector:
            matchLabels: {{- include "postarix.selector" (list . "cyrus-backend") | nindent 14 }}
      ports:
        - { port: 143 }
        - { port: 110 }
        - { port: 24 }
        - { port: 80 }
        - { port: 4190 }
    - from:
        - podSelector:
            matchLabels: {{- include "postarix.selector" (list . "api") | nindent 14 }}
      ports:
        - { port: 1143 }
        - { port: 8008 }
---
# The mupdate server: the backends and the frontend only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "postarix.name" (list . "mupdate") }}
  labels: {{- include "postarix.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "postarix.selector" (list . "mupdate") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "postarix.selector" (list . "mail") | nindent 14 }}
        - podSelector:
            matchLabels: {{- include "postarix.selector" (list . "cyrus-backend") | nindent 14 }}
      ports:
        - { port: 3905 }
---
{{- end }}
# Data stores, the spam filter and the virus scanner accept only the pods
# that use them: a compromised web pod cannot reach the database directly or
# feed the filter.
{{- $clients := dict
      "postgres" (list "api" "mail")
      "valkey" (list "api" "rspamd")
      "clamav" (list "rspamd") }}
{{- $components := list "postgres" "valkey" }}
{{- if .Values.clamav.enabled }}{{- $components = append $components "clamav" }}{{- end }}
{{- range $component := $components }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "postarix.name" (list $ $component) }}
  labels: {{- include "postarix.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "postarix.selector" (list $ $component) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $client := get $clients $component }}
        - podSelector:
            matchLabels: {{- include "postarix.selector" (list $ $client) | nindent 14 }}
        {{- end }}
---
{{- end }}
# Rspamd: the milter (11332) for Postfix in the mail pod, the read-only
# controller (11334) for the API's filtering history.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "postarix.name" (list . "rspamd") }}
  labels: {{- include "postarix.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "postarix.selector" (list . "rspamd") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "postarix.selector" (list . "mail") | nindent 14 }}
      ports:
        - { port: 11332 }
    - from:
        - podSelector:
            matchLabels: {{- include "postarix.selector" (list . "api") | nindent 14 }}
      ports:
        - { port: 11334 }
---
# The resolver: Postarix' own pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "postarix.name" (list . "unbound") }}
  labels: {{- include "postarix.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "postarix.selector" (list . "unbound") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
