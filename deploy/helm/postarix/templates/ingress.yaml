{{- if .Values.ingress.enabled }}
{{- $host := (urlParse .Values.publicUrl).host }}
{{- $api := include "postarix.name" (list . "api") }}
{{- $dav := include "postarix.name" (list . "mail-internal") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "postarix.fullname" . }}
  labels: {{- include "postarix.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ $host | quote }}
        {{- range $.Values.ingress.discoveryDomains }}
        - {{ printf "autoconfig.%s" . | quote }}
        - {{ printf "mta-sts.%s" . | quote }}
        {{- end }}
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          # The API's public prefixes, listed one by one so /api/internal/* is
          # never routed (an Ingress cannot exclude a path). Anything else under
          # /api reaches the webmail, which refuses /api/internal as well.
          {{- range list "/api/auth" "/api/jmap" "/api/mail" "/api/me" "/api/orgs" "/api/admin" "/api/health" "/.well-known/autoconfig" "/mail/config-v1.1.xml" "/autodiscover/autodiscover.xml" "/.well-known/mta-sts.txt" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service: { name: {{ $api }}, port: { name: http } }
          {{- end }}
          {{- range list "/.well-known/caldav" "/.well-known/carddav" "/dav" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service: { name: {{ $dav }}, port: { name: dav } }
          {{- end }}
          - path: /admin
            pathType: Prefix
            backend:
              service: { name: {{ include "postarix.name" (list . "admin") }}, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ include "postarix.name" (list . "webmail") }}, port: { name: http } }
    {{- /* Mail apps and receiving servers look these up by the mail domain's own names. */}}
    {{- range $.Values.ingress.discoveryDomains }}
    {{- range list (printf "autoconfig.%s" .) (printf "mta-sts.%s" .) }}
    - host: {{ . | quote }}
      http:
        paths:
          {{- range list "/mail/config-v1.1.xml" "/.well-known/autoconfig" "/.well-known/mta-sts.txt" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service: { name: {{ $api }}, port: { name: http } }
          {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
