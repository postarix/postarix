{{- $name := include "postarix.name" (list . "api") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "postarix.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {{- include "postarix.selector" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "postarix.selector" (list . "api") | nindent 8 }}
      annotations:
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- if and .Values.metrics.enabled .Values.metrics.podAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
        {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        # The images run as "node"; Kubernetes needs its numeric id to check it is not root.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: {{ include "postarix.image" (list . "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "postarix.appSecurity" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
            - name: internal-tls
              containerPort: 3443
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: 9464
            {{- end }}
          env:
            {{- include "postarix.secretEnv" (list . "POSTGRES_PASSWORD") | nindent 12 }}
            {{- include "postarix.secretEnv" (list . "VALKEY_PASSWORD") | nindent 12 }}
            {{- include "postarix.secretEnv" (list . "AUTH_SECRET") | nindent 12 }}
            {{- include "postarix.secretEnv" (list . "INTERNAL_API_TOKEN") | nindent 12 }}
            {{- include "postarix.secretEnv" (list . "POSTARIX_SECRET_MAIL_AUTH") | nindent 12 }}
            {{- include "postarix.secretEnv" (list . "POSTARIX_SECRET_SUBMISSION") | nindent 12 }}
            # Logs (and the mail queue) shown to instance administrators; optional for existing secrets.
            - name: POSTARIX_SECRET_REPORTS
              valueFrom:
                secretKeyRef:
                  name: {{ include "postarix.secretName" . }}
                  key: POSTARIX_SECRET_REPORTS
                  optional: true
            - name: POSTARIX_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            {{- include "postarix.secretEnv" (list . "CYRUS_ADMIN_PASSWORD") | nindent 12 }}
            {{- include "postarix.secretEnv" (list . "RSPAMD_CONTROLLER_PASSWORD") | nindent 12 }}
            - name: NODE_ENV
              value: {{ .Values.api.nodeEnv | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.api.logFormat | quote }}
            {{- if .Values.metrics.enabled }}
            - name: METRICS_PORT
              value: "9464"
            {{- end }}
            - name: DATABASE_URL
              value: "postgresql://postarix:$(POSTGRES_PASSWORD)@{{ include "postarix.postgresHost" . }}:5432/postarix"
            - name: VALKEY_URL
              value: "redis://:$(VALKEY_PASSWORD)@{{ include "postarix.valkeyHost" . }}:6379"
            - name: AUTH_URL
              value: {{ .Values.publicUrl | quote }}
            - name: TRUSTED_ORIGINS
              value: {{ join "," .Values.api.trustedOrigins | quote }}
            - name: TRUSTED_PROXIES
              value: {{ join "," .Values.api.trustedProxies | quote }}
            - name: SSO_TRUSTED_ISSUERS
              value: {{ join "," .Values.api.ssoTrustedIssuers | quote }}
            - name: MAIL_IMPORT_ALLOWED_HOSTS
              value: {{ join "," .Values.api.mailImportAllowedHosts | quote }}
            {{- with .Values.api.systemMailFrom }}
            - name: SYSTEM_MAIL_FROM
              value: {{ . | quote }}
            {{- end }}
            - name: MAIL_HOSTNAME
              value: {{ .Values.mailHostname | quote }}
            - name: DOMAIN_VERIFICATION
              value: {{ .Values.api.domainVerification | quote }}
            - name: MAIL_ENGINE
              value: cyrus
            - name: CYRUS_HOST
              value: {{ include "postarix.name" (list . "mail-internal") }}
            - name: CYRUS_PORT
              value: "1143"
            - name: CYRUS_SECURITY
              value: starttls
            - name: CYRUS_TLS_SERVERNAME
              value: {{ .Values.mailHostname | quote }}
            - name: CYRUS_TLS_CA_FILE
              value: /certs/fullchain.pem
            # Internal HTTPS listener for the mail-login bridge.
            - name: INTERNAL_TLS_CERT_FILE
              value: /certs/fullchain.pem
            - name: INTERNAL_TLS_KEY_FILE
              value: /certs/privkey.pem
            {{- if .Values.mail.murder.enabled }}
            # Each mailbox is on one of these backends (admin IMAP and JMAP).
            - name: CYRUS_BACKENDS
              value: {{ include "postarix.murderBackends" (list . true) | quote }}
            {{- end }}
            - name: CYRUS_JMAP_URL
              value: "https://{{ include "postarix.name" (list . "mail-internal") }}:8008"
            - name: SUBMISSION_HOST
              value: {{ include "postarix.name" (list . "mail-internal") }}
            - name: SUBMISSION_PORT
              value: "10587"
            - name: RSPAMD_CONTROLLER_URL
              value: "http://{{ include "postarix.name" (list . "rspamd") }}:11334"
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: certs
          secret:
            secretName: {{ .Values.tls.secretName }}
            # Readable by the API's user only (fsGroup below).
            defaultMode: 0440
            items:
              - { key: tls.crt, path: fullchain.pem }
              - { key: tls.key, path: privkey.pem }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "postarix.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector: {{- include "postarix.selector" (list . "api") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
    # The mail-login bridge (from the mail pod only; see the network policy).
    - name: internal-tls
      port: 3443
      targetPort: internal-tls
    {{- if .Values.metrics.enabled }}
    # Prometheus metrics (/metrics, and Rspamd's at /metrics/rspamd). Never routed by the ingress.
    - name: metrics
      port: 9464
      targetPort: metrics
    {{- end }}
{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels: {{- include "postarix.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}{{ toYaml . | nindent 4 }}{{ end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
    - port: metrics
      path: /metrics/rspamd
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
{{- if and .Values.metrics.enabled .Values.metrics.prometheusRule.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $name }}
  labels: {{- include "postarix.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}{{ toYaml . | nindent 4 }}{{ end }}
spec: {{- .Files.Get "files/alerts.yml" | fromYaml | toYaml | nindent 2 }}
{{- end }}
