{{- if not .Values.existingSecret }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postarix.secretName" . }}
  labels: {{- include "postarix.labels" . | nindent 4 }}
type: Opaque
stringData:
  AUTH_SECRET: {{ required "secrets.authSecret is required (32+ characters)" $s.authSecret | quote }}
  INTERNAL_API_TOKEN: {{ required "secrets.internalApiToken is required (32+ characters)" $s.internalApiToken | quote }}
  CYRUS_ADMIN_PASSWORD: {{ required "secrets.cyrusAdminPassword is required" $s.cyrusAdminPassword | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required" $s.postgresPassword | quote }}
  POSTFIX_DB_PASSWORD: {{ required "secrets.postfixDbPassword is required" $s.postfixDbPassword | quote }}
  VALKEY_PASSWORD: {{ required "secrets.valkeyPassword is required" $s.valkeyPassword | quote }}
  RSPAMD_CONTROLLER_PASSWORD: {{ required "secrets.rspamdControllerPassword is required" $s.rspamdControllerPassword | quote }}
{{- end }}
