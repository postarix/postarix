{{- $name := include "postarix.name" (list . "webmail") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "postarix.labels" . | nindent 4 }}
    app.kubernetes.io/component: webmail
spec:
  replicas: {{ .Values.webmail.replicas }}
  selector:
    matchLabels: {{- include "postarix.selector" (list . "webmail") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "postarix.selector" (list . "webmail") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        # The images run as "node"; Kubernetes needs its numeric id to check it is not root.
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: webmail
          image: {{ include "postarix.image" (list . "webmail") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "postarix.containerSecurity" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 3002
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.webmail.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "postarix.labels" . | nindent 4 }}
spec:
  selector: {{- include "postarix.selector" (list . "webmail") | nindent 4 }}
  ports:
    - name: http
      port: 3002
      targetPort: http
