# Written for Postarix: clamd in the foreground, on TCP for Rspamd only.
Foreground yes
User clamav
LogTime yes
LogVerbose no
DatabaseDirectory /var/lib/clamav
TCPSocket 3310
TCPAddr 0.0.0.0
MaxThreads 8
MaxConnectionQueueLength 30
StreamMaxLength 50M
MaxScanSize 100M
MaxFileSize 50M
MaxRecursion 16
MaxFiles 10000
ScanArchive yes
ScanPDF yes
ScanOLE2 yes
ScanHTML yes
AlertBrokenExecutables no
SelfCheck 3600
ConcurrentDatabaseReload yes
