# Sign authenticated (outgoing) mail with the domain's key, published in
# Valkey by the Postarix API: DKIM_SELECTORS maps a domain to its selector,
# DKIM_KEYS maps "<selector>.<domain>" to the private key.
enabled = true;
use_redis = true;
key_prefix = "DKIM_KEYS";
selector_prefix = "DKIM_SELECTORS";
sign_authenticated = true;
sign_local = false;
use_domain = "header";
# Sign with the exact From domain (not its registrable parent).
use_esld = false;
allow_hdrfrom_mismatch = false;
# The From header is tied to the login by the POSTARIX_FROM_NOT_OWNED prefilter
# (rspamd.local.lua), which also covers send-as aliases on other domains.
allow_username_mismatch = true;
allow_envfrom_empty = false;
