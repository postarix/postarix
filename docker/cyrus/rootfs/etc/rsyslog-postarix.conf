# Cyrus and saslauthd log to syslog. Everything goes to the container output,
# and to a file on the shared logs volume that CrowdSec reads.
module(load="imuxsock" SysSock.Name="/dev/log")
*.* action(type="omfile" file="/dev/stdout" template="RSYSLOG_TraditionalFileFormat")
*.* action(type="omfile" file="/var/log/postarix/cyrus.log" template="RSYSLOG_TraditionalFileFormat")
