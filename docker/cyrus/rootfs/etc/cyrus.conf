# Cyrus master process configuration.
START {
  recover       cmd="/usr/sbin/cyrus ctl_cyrusdb -r"
}

SERVICES {
  # Client-facing services. The main configuration grants no admin rights.
  imap          cmd="imapd -U 30" listen="143" prefork=1 maxchild=200
  imaps         cmd="imapd -s -U 30" listen="993" prefork=1 maxchild=200
  pop3s         cmd="pop3d -s -U 30" listen="995" prefork=0 maxchild=50
  sieve         cmd="timsieved" listen="4190" prefork=0 maxchild=50

  # Internal only (never published): admin IMAP for the Postarix API,
  # LMTP delivery from Postfix, and HTTP for JMAP/CalDAV/CardDAV behind the proxy.
  imapadmin     cmd="imapd -C /etc/imapd-admin.conf -U 30" listen="1143" prefork=0 maxchild=10
  lmtp          cmd="lmtpd -a" listen="24" prefork=1 maxchild=20
  http          cmd="httpd -U 30" listen="8080" prefork=1 maxchild=100
}

EVENTS {
  checkpoint    cmd="/usr/sbin/cyrus ctl_cyrusdb -c" period=30
  delprune      cmd="/usr/sbin/cyrus expire -E 3" at=0401
  tlsprune      cmd="/usr/sbin/cyrus tls_prune" at=0401
  deleteprune   cmd="/usr/sbin/cyrus expire -E 4 -D 28" at=0430
  expungeprune  cmd="/usr/sbin/cyrus expire -E 4 -X 28" at=0445
}
