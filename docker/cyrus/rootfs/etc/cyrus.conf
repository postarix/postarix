# Cyrus master process configuration.
START {
  recover       cmd="/usr/sbin/cyrus ctl_cyrusdb -r"
}

SERVICES {
  # Client-facing services. The main configuration grants no admin rights.
  imap          cmd="imapd -U 30" listen="0.0.0.0:143" prefork=1 maxchild=200
  imaps         cmd="imapd -s -U 30" listen="0.0.0.0:993" prefork=1 maxchild=200
  pop3s         cmd="pop3d -s -U 30" listen="0.0.0.0:995" prefork=0 maxchild=50
  sieve         cmd="timsieved" listen="0.0.0.0:4190" prefork=0 maxchild=50

  # Internal only (never published): admin IMAP for the Postarix API,
  # LMTP delivery from Postfix, and HTTP for CalDAV/CardDAV behind the proxy.
  # LMTP is pre-authenticated (-a), so it listens only on a Unix socket in a
  # volume shared with Postfix, never on the network.
  imapadmin     cmd="imapd -C /etc/imapd-admin.conf -U 30" listen="0.0.0.0:1143" prefork=0 maxchild=10
  lmtp          cmd="lmtpd -a" listen="/run/cyrus/lmtp/lmtp" prefork=1 maxchild=20
  http          cmd="httpd -U 30" listen="0.0.0.0:8080" prefork=1 maxchild=100
  # JMAP for the webmail, reached only by the Postarix API, which logs in as
  # the user with a short-lived token of its own.
  jmap          cmd="httpd -C /etc/imapd-jmap.conf -U 30" listen="0.0.0.0:8008" prefork=1 maxchild=100
}

DAEMON {
  # Indexes new and changed messages for full-text search as they arrive.
  squatter      cmd="squatter -R"
}

EVENTS {
  checkpoint    cmd="/usr/sbin/cyrus ctl_cyrusdb -c" period=30
  delprune      cmd="/usr/sbin/cyrus expire -E 3" at=0401
  tlsprune      cmd="/usr/sbin/cyrus tls_prune" at=0401
  deleteprune   cmd="/usr/sbin/cyrus expire -E 4 -D 28" at=0430
  expungeprune  cmd="/usr/sbin/cyrus expire -E 4 -X 28" at=0445
}
