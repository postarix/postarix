# Cyrus Murder: mailboxes spread over several Cyrus backends.
#   docker compose -f postarix.yml -f murder.yml --env-file postarix.env up -d
# The "cyrus" service becomes the frontend: clients (IMAP, POP3, ManageSieve,
# CalDAV/CardDAV) and Postfix keep connecting to it, and it routes each user
# to their backend. The mupdate server keeps the list of which mailbox is on
# which backend. The API creates each mailbox on the backend with the fewest
# and talks to that backend directly. See docs/SCALING.md.
#
# Add a backend: copy cyrus-backend-2 (its name, volumes and CYRUS_SERVERNAME),
# then add it to MURDER_BACKENDS (frontend) and CYRUS_BACKENDS (API).
x-backend: &backend
  restart: unless-stopped
  cap_drop: [NET_RAW]
  security_opt: [no-new-privileges:true]
  image: ${POSTARIX_REGISTRY:-ghcr.io/postarix}/cyrus:${POSTARIX_VERSION:-dev}
  depends_on:
    api:
      condition: service_started
    certs:
      condition: service_healthy
    mupdate:
      condition: service_healthy

services:
  mupdate:
    restart: unless-stopped
    image: ${POSTARIX_REGISTRY:-ghcr.io/postarix}/cyrus:${POSTARIX_VERSION:-dev}
    environment:
      CYRUS_ROLE: mupdate
      CYRUS_SERVERNAME: mupdate
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      CYRUS_ADMIN_PASSWORD: ${CYRUS_ADMIN_PASSWORD}
      POSTARIX_SECRET_MURDER_MUPDATE: ${POSTARIX_SECRET_MURDER_MUPDATE:?run deploy/scripts/derive-secrets.sh}
    cap_drop: [NET_RAW]
    security_opt: [no-new-privileges:true]
    volumes:
      - mupdate-lib:/var/lib/cyrus
      - certs:/certs:ro
    depends_on:
      certs:
        condition: service_healthy

  cyrus-backend-1:
    <<: *backend
    hostname: cyrus-backend-1
    environment: &backend-env
      CYRUS_ROLE: backend
      CYRUS_SERVERNAME: cyrus-backend-1
      MURDER_MUPDATE_HOST: mupdate
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      CYRUS_ADMIN_PASSWORD: ${CYRUS_ADMIN_PASSWORD}
      POSTARIX_SECRET_MAIL_AUTH: ${POSTARIX_SECRET_MAIL_AUTH}
      POSTARIX_SECRET_CYRUS_SMTP: ${POSTARIX_SECRET_CYRUS_SMTP}
      POSTARIX_SECRET_MURDER_MUPDATE: ${POSTARIX_SECRET_MURDER_MUPDATE}
      POSTARIX_SECRET_MURDER_PROXY: ${POSTARIX_SECRET_MURDER_PROXY:?run deploy/scripts/derive-secrets.sh}
      POSTARIX_SECRET_MURDER_XFER: ${POSTARIX_SECRET_MURDER_XFER:?run deploy/scripts/derive-secrets.sh}
      POSTARIX_API_INTERNAL: api:3443
      # Backends are on the internal network only.
      JMAP_LISTEN_ADDRESS: 0.0.0.0
    volumes:
      - backend-1-lib:/var/lib/cyrus
      - backend-1-spool:/var/spool/cyrus
      - backend-1-sieve:/var/spool/sieve
      - mail-logs:/var/log/postarix
      - certs:/certs:ro

  cyrus-backend-2:
    <<: *backend
    hostname: cyrus-backend-2
    environment:
      <<: *backend-env
      CYRUS_SERVERNAME: cyrus-backend-2
    volumes:
      - backend-2-lib:/var/lib/cyrus
      - backend-2-spool:/var/spool/cyrus
      - backend-2-sieve:/var/spool/sieve
      - mail-logs:/var/log/postarix
      - certs:/certs:ro

  cyrus:
    environment:
      CYRUS_ROLE: frontend
      MURDER_MUPDATE_HOST: mupdate
      MURDER_BACKENDS: cyrus-backend-1 cyrus-backend-2
      POSTARIX_SECRET_MURDER_MUPDATE: ${POSTARIX_SECRET_MURDER_MUPDATE}
      POSTARIX_SECRET_MURDER_PROXY: ${POSTARIX_SECRET_MURDER_PROXY}
    depends_on:
      cyrus-backend-1:
        condition: service_healthy
      cyrus-backend-2:
        condition: service_healthy

  api:
    environment:
      CYRUS_BACKENDS: b1=cyrus-backend-1,b2=cyrus-backend-2

volumes:
  mupdate-lib:
  backend-1-lib:
  backend-1-spool:
  backend-1-sieve:
  backend-2-lib:
  backend-2-spool:
  backend-2-sieve:
