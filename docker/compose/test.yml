# Overrides for local runs and the integration tests: development mode,
# immediate domain activation, no greylisting, and published high ports.
#   docker compose -f postarix.yml -f test.yml --env-file test.env up -d --build
services:
  api:
    environment:
      NODE_ENV: development
      DOMAIN_VERIFICATION: skip
      # The webmail is published on its own port in the tests.
      TRUSTED_ORIGINS: http://localhost:3002
    ports:
      - "3000:3000"
  rspamd:
    environment:
      RSPAMD_GREYLIST: "false"
      # A body marker that scores as ordinary spam (unlike GTUBE, which skips
      # the remaining rules), to test spam handling end to end.
      RSPAMD_TEST_RULES: "true"
      CLAMAV_SERVERS: clamav:3310
  # Virus scanning is tested too, with the EICAR test signature only (no
  # Internet access to download the real ones).
  clamav:
    profiles: !reset []
    environment:
      CLAMAV_TEST_SIGNATURES: "true"
  # The webmail on its own port, forwarding /api to the API (no reverse proxy in the tests).
  webmail:
    environment:
      API_PROXY_URL: http://api:3000
    networks: [default, proxy]
    ports:
      - "3002:3002"
  # CalDAV/CardDAV, published so the tests can sync like a phone would.
  cyrus:
    ports:
      - "8085:8080"
