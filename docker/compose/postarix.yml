# Postarix: the full mail stack.
#
#   cp docker/compose/postarix.env.example docker/compose/postarix.env   # fill in every secret
#   docker compose -f docker/compose/postarix.yml --env-file docker/compose/postarix.env up -d --build
#
# Mail ports (25, 465, 587, 143, 993, 995, 4190) are published directly.
# HTTP services (api, admin, webmail, Cyrus CalDAV/CardDAV) are meant to sit behind your reverse
# proxy, which joins the "proxy" network (postarix_proxy); see deploy/proxies.
# /api/internal/* must never be proxied. Databases, Valkey, Rspamd and Postfix
# stay on the "default" network, out of the proxy's reach.
name: postarix

x-restart: &restart
  restart: unless-stopped
  # No raw sockets: a compromised container cannot spoof traffic on the network.
  cap_drop: [NET_RAW]

services:
  postgres:
    <<: *restart
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    environment:
      POSTGRES_USER: postarix
      POSTGRES_DB: postarix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTFIX_DB_PASSWORD: ${POSTFIX_DB_PASSWORD:?set POSTFIX_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../postgres/10-postarix-mail-role.sh:/docker-entrypoint-initdb.d/10-postarix-mail-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postarix -d postarix"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 20

  valkey:
    <<: *restart
    image: ${VALKEY_IMAGE:-valkey/valkey:8-alpine}
    command: ["sh", "-c", "exec valkey-server --appendonly yes --save 60 1 --requirepass \"$$VALKEY_PASSWORD\""]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD}
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$VALKEY_PASSWORD\" valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  unbound:
    <<: *restart
    image: postarix/unbound:${POSTARIX_VERSION:-dev}
    build:
      context: ../unbound
      args:
        BASE_IMAGE: ${BASE_IMAGE:-debian:trixie-slim}
    networks:
      default:
        # Fixed address so Postfix can use it as its (DNSSEC-validating) resolver.
        ipv4_address: ${UNBOUND_IP:-172.30.53.53}

  rspamd:
    <<: *restart
    image: postarix/rspamd:${POSTARIX_VERSION:-dev}
    build:
      context: ../rspamd
      args:
        BASE_IMAGE: ${BASE_IMAGE:-debian:trixie-slim}
    environment:
      RSPAMD_CONTROLLER_PASSWORD: ${RSPAMD_CONTROLLER_PASSWORD:?set RSPAMD_CONTROLLER_PASSWORD}
      RSPAMD_GREYLIST: ${RSPAMD_GREYLIST:-true}
      REDIS_SERVERS: valkey:6379
      REDIS_PASSWORD: ${VALKEY_PASSWORD}
      DNS_RESOLVER: unbound
    volumes:
      - rspamd-data:/var/lib/rspamd
    depends_on:
      unbound:
        condition: service_started
      valkey:
        condition: service_healthy

  certs:
    <<: *restart
    image: postarix/certs:${POSTARIX_VERSION:-dev}
    build:
      context: ../certs
      args:
        BASE_IMAGE: ${BASE_IMAGE:-debian:trixie-slim}
    environment:
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      # selfsigned | acme | external — see docker/certs/README.md
      CERTS_MODE: ${CERTS_MODE:-selfsigned}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_DOMAINS: ${ACME_DOMAINS:-}
      ACME_CHALLENGE: ${ACME_CHALLENGE:-http}
      ACME_DNS_PROVIDER: ${ACME_DNS_PROVIDER:-}
      ACME_SERVER: ${ACME_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      CERTS_EXTERNAL_DIR: /external
      CERTS_EXTERNAL_CERT: ${CERTS_EXTERNAL_CERT:-fullchain.pem}
      CERTS_EXTERNAL_KEY: ${CERTS_EXTERNAL_KEY:-privkey.pem}
    env_file:
      # Credentials for lego's DNS provider (e.g. CLOUDFLARE_DNS_API_TOKEN), if any.
      - path: ${ACME_DNS_ENV_FILE:-/dev/null}
        required: false
    # Holds DNS provider credentials: kept off the internal network. It only
    # needs the Internet (ACME) and the proxy (HTTP challenges).
    networks: [proxy]
    volumes:
      - certs:/certs
      - lego-data:/var/lib/lego
      - ${CERTS_EXTERNAL_PATH:-./external-certs}:/external:ro

  api:
    <<: *restart
    image: postarix/api:${POSTARIX_VERSION:-dev}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-trixie-slim}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://postarix:${POSTGRES_PASSWORD}@postgres:5432/postarix
      AUTH_URL: ${AUTH_URL:?set AUTH_URL (public URL of the API)}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      SSO_TRUSTED_ISSUERS: ${SSO_TRUSTED_ISSUERS:-}
      SYSTEM_MAIL_FROM: ${SYSTEM_MAIL_FROM:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      MAIL_ENGINE: cyrus
      CYRUS_HOST: cyrus
      CYRUS_PORT: 1143
      CYRUS_SECURITY: starttls
      # Cyrus' certificate names the public host; the shared certificate file
      # pins it even when it is self-signed.
      CYRUS_TLS_SERVERNAME: ${MAIL_HOSTNAME}
      CYRUS_TLS_CA_FILE: /certs/fullchain.pem
      INTERNAL_TLS_CERT_FILE: /certs/fullchain.pem
      INTERNAL_TLS_KEY_FILE: /certs/api-privkey.pem
      CYRUS_ADMIN_PASSWORD: ${CYRUS_ADMIN_PASSWORD:?set CYRUS_ADMIN_PASSWORD}
      # Cyrus' internal JMAP service, used to serve the webmail.
      # By address: the JMAP service listens on the internal network only.
      CYRUS_JMAP_URL: https://${CYRUS_IP:-172.30.53.10}:8008
      # Filtering history shown to organization admins.
      RSPAMD_CONTROLLER_URL: http://rspamd:11334
      RSPAMD_CONTROLLER_PASSWORD: ${RSPAMD_CONTROLLER_PASSWORD}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN}
      DOMAIN_VERIFICATION: ${DOMAIN_VERIFICATION:-dns}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379
    networks: [default, proxy]
    volumes:
      - certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      certs:
        condition: service_healthy

  admin:
    <<: *restart
    image: postarix/admin:${POSTARIX_VERSION:-dev}
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-trixie-slim}
    # Serves /admin. It only talks to the browser (and, for setups whose proxy
    # does not route /api itself, forwards /api to the API).
    networks: [proxy]
    depends_on:
      api:
        condition: service_started

  webmail:
    <<: *restart
    image: postarix/webmail:${POSTARIX_VERSION:-dev}
    build:
      context: ../..
      dockerfile: apps/webmail/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-trixie-slim}
    # Serves the site root (/). Static files only; the reverse proxy routes /api.
    networks: [proxy]

  cyrus:
    <<: *restart
    image: postarix/cyrus:${POSTARIX_VERSION:-dev}
    build:
      context: ../cyrus
      args:
        BASE_IMAGE: ${BASE_IMAGE:-debian:trixie-slim}
    hostname: ${MAIL_HOSTNAME:?set MAIL_HOSTNAME}
    environment:
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      CYRUS_ADMIN_PASSWORD: ${CYRUS_ADMIN_PASSWORD}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      POSTARIX_API_INTERNAL: api:3443
      # The internal JMAP service (for the API) binds to this address only, so
      # containers on the proxy network cannot reach it.
      JMAP_LISTEN_ADDRESS: ${CYRUS_IP:-172.30.53.10}
    ports:
      - "${IMAP_PORT:-143}:143"
      - "${IMAPS_PORT:-993}:993"
      - "${POP3S_PORT:-995}:995"
      - "${SIEVE_PORT:-4190}:4190"
    volumes:
      - cyrus-lib:/var/lib/cyrus
      - cyrus-spool:/var/spool/cyrus
      - cyrus-sieve:/var/spool/sieve
      - saslauthd-run:/run/saslauthd
      - lmtp-socket:/run/cyrus/lmtp
      - mail-logs:/var/log/postarix
      - certs:/certs:ro
    networks:
      default:
        ipv4_address: ${CYRUS_IP:-172.30.53.10}
      proxy: {}
    depends_on:
      api:
        condition: service_started
      certs:
        condition: service_healthy

  postfix:
    <<: *restart
    image: postarix/postfix:${POSTARIX_VERSION:-dev}
    build:
      context: ../postfix
      args:
        BASE_IMAGE: ${BASE_IMAGE:-debian:trixie-slim}
    hostname: ${MAIL_HOSTNAME}
    # Validated DNS answers (AD bit) enable DANE for outgoing TLS.
    dns:
      - ${UNBOUND_IP:-172.30.53.53}
    dns_opt:
      - trust-ad
    environment:
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      POSTFIX_DB_PASSWORD: ${POSTFIX_DB_PASSWORD}
      MESSAGE_SIZE_LIMIT: ${MESSAGE_SIZE_LIMIT:-52428800}
      # Password of the API's account on the internal submission port (10587).
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    ports:
      - "${SMTP_PORT:-25}:25"
      - "${SUBMISSIONS_PORT:-465}:465"
      - "${SUBMISSION_PORT:-587}:587"
    volumes:
      - postfix-spool:/var/spool/postfix
      - saslauthd-run:/run/saslauthd
      - lmtp-socket:/run/cyrus-lmtp
      - mail-logs:/var/log/postarix
      - certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      rspamd:
        condition: service_healthy
      cyrus:
        condition: service_healthy
      certs:
        condition: service_healthy
      unbound:
        condition: service_started

  # Optional (docker compose --profile crowdsec up -d): spots password guessing
  # and abuse in the Postfix and Cyrus logs. Its decisions are enforced on the
  # host by the CrowdSec firewall bouncer through the local API published on
  # 127.0.0.1 only. See docs/CROWDSEC.md.
  crowdsec:
    <<: *restart
    profiles: [crowdsec]
    image: postarix/crowdsec:${POSTARIX_VERSION:-dev}
    build:
      context: ../crowdsec
      args:
        BASE_IMAGE: ${BASE_IMAGE:-debian:trixie-slim}
    environment:
      CROWDSEC_BOUNCER_KEY: ${CROWDSEC_BOUNCER_KEY:-}
    ports:
      - "127.0.0.1:${CROWDSEC_LAPI_PORT:-8081}:8080"
    volumes:
      - mail-logs:/var/log/postarix:ro
      - crowdsec-data:/var/lib/crowdsec/data

networks:
  default:
    ipam:
      config:
        - subnet: ${POSTARIX_SUBNET:-172.30.53.0/24}
  # What the reverse proxy joins: the API, the admin panel, the webmail, Cyrus (CalDAV/CardDAV)
  # and the certs service (ACME HTTP challenges) only. Set TRUSTED_PROXIES to its range.
  proxy:
    ipam:
      config:
        - subnet: ${POSTARIX_PROXY_SUBNET:-172.30.54.0/24}

volumes:
  lmtp-socket:
  mail-logs:
  crowdsec-data:
  postgres-data:
  valkey-data:
  rspamd-data:
  cyrus-lib:
  cyrus-spool:
  cyrus-sieve:
  postfix-spool:
  saslauthd-run:
  certs:
  lego-data:
