# Failed logins on Cyrus (IMAP, POP3, ManageSieve), e.g.
#   cyrus/imaps[110]: badlogin: unknown [203.0.113.7] PLAIN [SASL(-13): authentication failure: checkpass failed]
onsuccess: next_stage
filter: "evt.Parsed.program startsWith 'cyrus/'"
name: postarix/cyrus-logs
description: "Parse Cyrus IMAP failed logins"
nodes:
  - grok:
      pattern: '^badlogin: (%{IPORHOST} )?\[%{IP:source_ip}\] %{NOTSPACE:mechanism}( %{NOTSPACE:user})? \[%{DATA:reason}\]'
      apply_on: message
statics:
  - meta: log_type
    value: imap_failed_auth
  - meta: service
    value: imap
  - meta: source_ip
    expression: "evt.Parsed.source_ip"
  - meta: username
    expression: "evt.Parsed.user"
